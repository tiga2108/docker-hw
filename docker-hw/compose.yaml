# Уровни 8-10: приложение + Redis
services:
  app:
    build: .
    image: docker-hw-app:latest
    environment:
      GREETING: ${GREETING:-Hello, Docker!}
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${HOST_PORT:-8080}:8000"   # публикуется только порт приложения
    depends_on:
      redis:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  redis-data:
